[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerspec-lh"
version = "1.0.0"
description = "Deterministic bank reconciliation and double-entry journal validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
ledgerspec = "ledgerspec_lh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
