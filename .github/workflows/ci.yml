name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Create example output directory
        run: python -c "from pathlib import Path; Path('runs').mkdir(exist_ok=True)"
      - name: Run bank reconciliation example
        run: ledgerspec reconcile examples/reconciliation.json --output runs/reconciliation --request-id example
      - name: Read completed reconciliation receipt
        run: ledgerspec reconcile examples/reconciliation.json --output runs/reconciliation --request-id example
      - name: Run journal validation example
        run: ledgerspec journal examples/journal.json --output runs/journal --request-id journal
